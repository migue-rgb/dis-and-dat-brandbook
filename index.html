<style>
:root{
  color-scheme: light;
  --lapicero:#000F28;
  --pergamino:#EBEADC;
  --lap45:rgba(0,15,40,.45);
  --line:rgba(0,15,40,.16);
  --bar-h:68px;
  --serif:"Baskervville",Georgia,serif;
  --sans:"Alegreya Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pergamino);color:var(--lapicero);font-family:var(--sans);font-size:16px;line-height:1.4}
a{color:inherit}

/* Botón glass, como los del Figma: Alegreya Sans Medium, mayúsculas, subrayado, +26% de tracking */
.glass{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;
  font:500 14px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;
  color:var(--lapicero);white-space:nowrap;border-radius:999px;padding:16px calc(24px - .26em) 16px 24px;
  background:linear-gradient(140deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,.14) 45%,rgba(255,255,255,.06) 70%,rgba(255,255,255,.24) 100%);
  -webkit-backdrop-filter:blur(6px) saturate(1.6);backdrop-filter:blur(6px) saturate(1.6);
  box-shadow:0 4px 4px rgba(0,0,0,.25),inset 1.5px 1.5px 1px rgba(255,255,255,.85),inset -1px -1px 1px rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.18);
  transition:box-shadow .2s,background .2s,transform .2s}
.glass:hover{background:linear-gradient(140deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.22) 45%,rgba(255,255,255,.12) 70%,rgba(255,255,255,.32) 100%);transform:translateY(-1px)}
.glass:active{transform:translateY(0);box-shadow:0 2px 3px rgba(0,0,0,.22),inset 1.5px 1.5px 1px rgba(255,255,255,.85),inset -1px -1px 1px rgba(255,255,255,.35)}

/* Barra superior */
.bar{position:sticky;top:0;z-index:20;background:rgba(235,234,220,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1920px;margin:0 auto;display:flex;align-items:center;gap:28px;height:var(--bar-h);padding:0 32px}
.brand{display:block;color:var(--lapicero);line-height:0;flex:none}
.brand svg{height:15px;width:auto;display:block}
nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center;padding:6px 4px}
nav::-webkit-scrollbar{display:none}
nav a{font:500 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--lap45);text-decoration:none;padding:11px 14px;border-radius:999px;white-space:nowrap;transition:color .2s,background .2s,box-shadow .2s}
nav a:hover{color:var(--lapicero)}
nav a.on{color:var(--lapicero);background:linear-gradient(140deg,rgba(255,255,255,.7),rgba(255,255,255,.3));box-shadow:0 2px 4px rgba(0,0,0,.14),inset 1px 1px 1px rgba(255,255,255,.9)}
.bar .glass{font-size:12px;padding:13px calc(18px - .26em) 13px 18px;flex:none}
.bar .glass .sm{display:none}
.hot:focus-visible,.glass:focus-visible,nav a:focus-visible,.brand:focus-visible{outline:2px solid var(--lapicero);outline-offset:3px}

/* Páginas (escritorio: el slide tal cual) */
main{max-width:1920px;margin:0 auto}
section{scroll-margin-top:var(--bar-h)}
.slide{margin:0;background:var(--bg)}
.canvas{position:relative;line-height:0}
.canvas img{display:block;width:100%;height:auto}
.hot{position:absolute;left:calc(var(--x) / var(--sw) * 100%);top:calc(var(--y) / var(--sh) * 100%);width:calc(var(--w) / var(--sw) * 100%);height:calc(var(--h) / var(--sh) * 100%);border-radius:999px;transition:background .2s}
.hot:hover{background:rgba(255,255,255,.22)}
.hot::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
.kv{display:flex;flex-direction:column;gap:calc(28 / 1920 * 100vw);padding:calc(48 / 1920 * 100vw) calc(79 / 1920 * 100%) calc(110 / 1920 * 100vw)}
@media (min-width:1920px){.kv{gap:28px;padding:48px 79px 110px}}
.kv img{display:block;width:100%;height:auto}
footer{border-top:1px solid var(--line);padding:28px 32px 40px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font:500 14px/1.3 var(--sans);color:var(--lap45);max-width:1920px;margin:0 auto}
footer b{color:var(--lapicero);font-weight:500}

/* Vista ampliada */
.zoom{position:fixed;inset:0;z-index:50;background:var(--pergamino);display:none;flex-direction:column}
.zoom.open{display:flex}
.zoom-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font:500 14px/1.3 var(--sans);color:var(--lap45)}
.zoom-top .glass{font-size:12px;padding:12px calc(16px - .26em) 12px 16px}
.zoom-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom-scroll .canvas{width:min(1920px,250vw)}
.zoom-scroll .canvas img{width:100%;max-width:none}
.hint{display:none}

/* Móvil y tablet: misma diagramación del Figma, en una columna y con texto real */
@media (max-width:900px){
  :root{--bar-h:100px}
  .bar-in{flex-wrap:wrap;height:auto;padding:12px 16px 4px;gap:8px 10px}
  .brand{flex:1 1 auto;min-width:0}
  .brand svg{height:10px;max-width:100%}
  .bar .glass{font-size:10.5px;padding:11px calc(12px - .2em) 11px 12px;letter-spacing:.2em}
  .bar .glass .lg{display:none}
  .bar .glass .sm{display:inline}
  nav{order:3;flex-basis:100%;justify-content:flex-start;margin:0 -16px;padding:4px 10px 6px}
  nav a{font-size:12.5px;padding:10px 12px}
  .hint{display:block;text-align:center;font:500 13px/1.3 var(--sans);color:var(--lap45);padding:9px 16px;border-bottom:1px solid var(--line);margin:0}
  .canvas img,.kv img{cursor:zoom-in}


}
@media (min-width:600px) and (max-width:900px){
  .brand svg{height:12px}
}
@media (max-width:380px){
  .brand svg{height:8.5px}
  .bar .glass{font-size:10px;letter-spacing:.18em}
  footer{padding:24px 20px 32px}
}

<script>
(function(){
  var links={};
  document.querySelectorAll('[data-nav]').forEach(function(a){links[a.dataset.nav]=a});
  var current=null;
  function setOn(id){
    if(id===current)return; current=id;
    Object.keys(links).forEach(function(k){links[k].classList.toggle('on',k===id)});
    var a=links[id]; if(a){var n=a.parentNode; if(n.scrollWidth>n.clientWidth) n.scrollTo({left:a.offsetLeft-n.clientWidth/2+a.clientWidth/2,behavior:'smooth'})}
  }
  if('IntersectionObserver' in window){
    var vis={};
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){vis[e.target.id]=e.isIntersecting?e.intersectionRect.height:0});
      var best=null,bh=0;Object.keys(vis).forEach(function(k){if(vis[k]>bh){bh=vis[k];best=k}});
      setOn(links[best]?best:null);
    },{threshold:[0,.1,.25,.5,.75,1]});
    document.querySelectorAll('[data-sec]').forEach(function(s){io.observe(s)});
  }
  var zoom=document.querySelector('.zoom'), zs=zoom.querySelector('.zoom-scroll');
  var mq=window.matchMedia('(max-width: 900px)');
  function open(src){
    var c=src.cloneNode(true), im=c.querySelector('img');
    im.removeAttribute('srcset'); im.removeAttribute('sizes'); im.loading='eager';
    zs.innerHTML=''; zs.appendChild(c);
    zoom.classList.add('open'); document.documentElement.style.overflow='hidden'; zs.scrollTo(0,0);
  }
  function close(){zoom.classList.remove('open');document.documentElement.style.overflow='';zs.innerHTML=''}
  document.querySelector('main').addEventListener('click',function(ev){
    if(!mq.matches||ev.target.closest('a'))return;
    var c=ev.target.closest('.canvas');
    if(c){open(c);return}
    var k=ev.target.closest('.kv img');
    if(k){var w=document.createElement('div');w.className='canvas';w.appendChild(k.cloneNode(true));open(w)}
  });
  zoom.querySelector('.zoom-close').addEventListener('click',close);
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&zoom.classList.contains('open'))close()});
})();
</script>
